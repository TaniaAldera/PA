<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Gadai - DigiTaksir</title>
    <link rel="stylesheet" href="style.css">
    <!-- Library untuk Grafik & PDF -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Pegadaian_logo.svg" alt="Logo Pegadaian">
        </div>
        <div class="header-title">
            <h2>DIGI<span>TAKSIR</span></h2>
        </div>
        <div class="header-right">
            <a href="index.html" class="btn-dashboard">Dashboard</a>
        </div>
    </header>

    <div class="container">
        <button class="back-btn" onclick="location.href='index.html'">← Kembali</button>
        
        <div class="card">
            <label>Mode Simulasi:</label>
            <div class="mode-selector">
                <div class="mode-btn active" onclick="switchMode('barang', this)">Input Barang</div>
                <div class="mode-btn" onclick="switchMode('up', this)">Input UP</div>
            </div>

            <!-- Mode Input Barang -->
            <div id="sectionBarang">
                <div id="itemsContainer"></div>
                <button class="btn-add-item" onclick="addItem()">+ Tambah Barang</button>
            </div>

            <!-- Mode Input UP -->
            <div id="sectionUP" class="hidden">
                <div class="input-group">
                    <label>Nominal Pinjaman (UP) Diinginkan:</label>
                    <input type="number" id="inputNominalUP" placeholder="Contoh: 5000000">
                </div>
            </div>

            <button class="btn-hitung" onclick="hitungTaksiran()">HITUNG SIMULASI</button>
        </div>

        <!-- Result Panel -->
        <div id="resultPanel" class="result-panel">
            <h3 style="text-align: center; color: var(--p-dark);">Hasil Simulasi</h3>
            <div class="up-val" id="resUP">Rp 0</div>
            
            <div class="info-row"><span>Total Taksiran:</span> <span id="resTaksiran">Rp 0</span></div>
            <div class="info-row"><span>LTV:</span> <span id="resLTV">0%</span></div>
            <div class="info-row"><span>Sewa Modal (15 Hari):</span> <span id="resSewa">Rp 0</span></div>

            <div class="chart-container">
                <canvas id="resultChart"></canvas>
            </div>

            <div class="table-title">Simulasi Akumulasi KCA</div>
            <div class="table-responsive">
                <table class="kca-table">
                    <thead>
                        <tr>
                            <th>Hari Ke-</th>
                            <th>Total Sewa</th>
                            <th>Pelunasan</th>
                        </tr>
                    </thead>
                    <tbody id="resTabelKCA"></tbody>
                </table>
            </div>
            
            <button class="btn-primary" style="margin-top: 15px;" onclick="exportPDF()">Download PDF</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Inisialisasi awal untuk halaman Digi-Taksir
        document.addEventListener('DOMContentLoaded', () => {
            addItem(); // Tambah item pertama otomatis
        });
    </script>
</body>
</html>
